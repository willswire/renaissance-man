<svg width="100%" viewBox="0 0 680 468" role="img" style="" xmlns="http://www.w3.org/2000/svg"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Revised renaissance-man architecture</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Anthropic Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Worldview and wisdom form a serial base at layers 1 and 2. Layer 3 is a tier of parallel domain-philosophy skills, with software design built first and future siblings shown faded. All three tiers sit inside the renaissance-man plugin bracket. Project plugins at layers 4 and 5 sit above, outside the bracket.</desc>
